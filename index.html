<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>entropy</title>
<style>
  body { margin: 0; background: #fff; color: #000; font-family: Georgia, serif; }
  #banner { text-align: center; padding: 40px 20px 10px; cursor: pointer; }
  #banner img { width: 90%; max-width: 900px; height: auto; }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; padding: 20px; }
  nav a { color: #000; text-decoration: none; font-variant: small-caps; letter-spacing: 2px; font-size: 20px; }
  nav a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div id="banner"><img src="entropy-logo.jpeg" alt="entropy"></div>
  <nav id="nav">
    <a href="#">home</a>
    <a href="#">political</a>
    <a href="#">gallery</a>
    <a href="#">projects</a>
    <a href="#">shop</a>
    <a href="#">about me</a>
  </nav>
<script>
  const nav = document.getElementById('nav');
  document.getElementById('banner').addEventListener('click', () => {
    const links = Array.from(nav.children);
    for (let i = links.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [links[i], links[j]] = [links[j], links[i]];
    }
    links.forEach(l => nav.appendChild(l));
  });
</script>
</body>
</html>
